[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner-api"
version = "0.1.0"
description = "AI Travel Planner API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "httpx>=0.28,<0.29",
    "PyJWT[crypto]>=2.15,<3",
    "google-genai>=2.34,<3",
    # IMD-115: the Vector(768) column type of rag_chunks.embedding (migration 0007).
    "pgvector>=0.5,<0.6",
]

[project.optional-dependencies]
# Linters and checkers are pinned exactly so local runs and CI report the same findings.
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<0.24",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "import-linter==2.15",
    "pip-audit>=2.10,<3",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

# The prompt templates are read from the installed package (app/ai/prompts/registry.py).
[tool.setuptools.package-data]
"app.ai.prompts" = ["templates/*/*/*.txt", "templates/*/*/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "S",     # flake8-bandit
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Plain assert is how pytest checks results.
"tests/**" = ["S101"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at line-length (100); E501 flags only what it cannot wrap
# (docstrings, comments, long strings) once a line passes 120.
max-line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "live: calls a real provider host (needs its key); the only tests the socket guard lets out; run by make live-smoke",
    "slow: long-running test",
]
asyncio_default_fixture_loop_scope = "function"
