# Alembic configuration (specification §5.5, IMD-01). Run from apps/api: make db-migrate runs
# `alembic upgrade head`; inspect with `alembic current` and `alembic heads`.
# There is no sqlalchemy.url here: migrations/env.py reads DATABASE_URL through app.core.config.
# Each revision executes migrations/sql/000N_<name>.sql and its down file; no autogenerate.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# New revisions: alembic revision --rev-id 000N -m "<name>", then add sql/000N_<name>.sql and
# sql/down/000N_<name>.down.sql and run them from upgrade() and downgrade() like 0001 to 0006.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
