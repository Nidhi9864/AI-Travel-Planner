# Pull-request checks (IMP-102, specification §13.7). Branch protection on main requires the six jobs
# by name: lint-types, unit, guards, attribution, audit, api. Every job installs with make setup and
# runs Makefile targets (§4.7); no secret other than GITHUB_TOKEN is used and no provider key exists
# in pull-request jobs (AI_PROVIDER=MOCK, APP_ENV=test, §4.5).
name: CI

on:
  pull_request:
    # edited re-runs the checks when the pull-request body changes (the attribution job reads it).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AI_PROVIDER: MOCK
  APP_ENV: test
  PYTHON_VERSION: "3.12"

jobs:
  lint-types:
    name: lint-types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make imports
      # IMP-214 (IMD-06): fails when contracts/ or the web types are stale against the API models.
      - run: make openapi-check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      - name: Place quality gate in check mode (no database)
        # IMP-205 step 4: every destination directory under data/fixtures and data/places passes
        # the §5.6 quality gate without a database write; a directory without destination.json
        # (notes only) is skipped.
        run: |
          dirs=()
          for dir in data/fixtures/*/ data/places/*/; do
            [ -d "$dir" ] || continue
            if [ -f "${dir}destination.json" ]; then
              dirs+=("$PWD/${dir%/}")
            else
              echo "skipped ${dir%/} (no destination.json)"
            fi
          done
          if [ "${#dirs[@]}" -eq 0 ]; then echo "no destination directory to check"; exit 0; fi
          cd apps/api && .venv/bin/python -m app.places.seed --check "${dirs[@]}"
      - run: make test-unit
      - run: make test-contract
      - run: make test-web

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail if a real env file is tracked
        # IMP-105, NFR-013: real values live only in untracked env files (§4.5). The two templates
        # .env.example and apps/web/.env.local.example are the only env files allowed in git.
        run: |
          tracked="$(git ls-files | grep -E '(^|/)(\.env(\..+)?|[^/]+\.env)$' \
            | grep -vxE '\.env\.example|apps/web/\.env\.local\.example' || true)"
          if [ -n "$tracked" ]; then
            echo "::error title=Tracked env file::remove these files from git and keep them local:"
            echo "$tracked"
            exit 1
          fi
          echo "No real env file is tracked."
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Secret scan of the pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}" .
      - name: Secret scan of the full history
        if: github.event_name == 'push'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  attribution:
    name: attribution
    # pull_request only: Rebase and merge gives the commits on main GitHub's committer (IMD-61, IMD-63).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit authors, committers, messages and the pull-request body
        env:
          TEAM_EMAILS: ${{ vars.TEAM_EMAILS }}
        run: bash scripts/check_attribution.sh

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      - name: pip-audit of the API dependencies (any known vulnerability fails)
        # Audits every installed runtime and dev dependency at its installed version. pip freeze
        # leaves out the virtual environment's own installer (pip), which is not a project
        # dependency; the next step reports it without failing the job.
        run: |
          apps/api/.venv/bin/python -m pip freeze --exclude-editable >"$RUNNER_TEMP/api-requirements.txt"
          apps/api/.venv/bin/pip-audit --requirement "$RUNNER_TEMP/api-requirements.txt" --no-deps --disable-pip
      - name: pip-audit of the virtual environment's installer (report only)
        run: |
          apps/api/.venv/bin/pip-audit --skip-editable \
            || echo "::warning title=pip-audit (venv installer)::the venv's own pip has known vulnerabilities; see the log above"
      - name: npm audit (critical findings fail)
        working-directory: apps/web
        run: npm audit --audit-level=critical

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # §4.7 test default; make db-migrate reads DATABASE_URL, so both name the blank service database.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/travel_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/travel_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      # §5.5 CI row: the blank postgres:16 gets the Supabase auth stub, then the migrations run up,
      # all the way down and up again, before the suites.
      - name: Apply the auth stub to the blank database
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/travel_test" -v ON_ERROR_STOP=1
          -f apps/api/migrations/sql/test_auth_stub.sql
      - run: make db-migrate
      - name: Alembic has one head
        working-directory: apps/api
        run: |
          heads="$(.venv/bin/alembic heads)"
          echo "$heads"
          [ "$(printf '%s\n' "$heads" | wc -l)" -eq 1 ]
      - name: Round trip (downgrade base, upgrade head)
        working-directory: apps/api
        run: .venv/bin/alembic downgrade base && .venv/bin/alembic upgrade head
      - run: make test-api
      - run: make test-authz
